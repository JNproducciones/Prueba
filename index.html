<style>

/* ============================================================
   TRILLY BURGUER — Design tokens
   ============================================================ */
:root{
  --bg:            #0c0a09;
  --bg-1:          #131010;
  --card:          #1c1714;
  --card-2:        #241d19;
  --line:          #332822;
  --cream:         #f7efe1;
  --muted:         #a89a8a;
  --muted-2:       #6f6459;
  --yellow:        #ffc72c;
  --orange:        #ff7a1a;
  --deep-orange:   #ff5a1f;
  --red:           #d3220f;
  --green:         #67b76a;
  --amber:         #f5a623;
  --flame: linear-gradient(120deg, var(--yellow) 0%, var(--orange) 48%, var(--red) 100%);
  --flame-soft: linear-gradient(120deg, rgba(255,199,44,.16), rgba(255,90,31,.16));
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
  --font-display: 'Anton', 'Poppins', sans-serif;
  --font-body: 'Poppins', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 600px at 50% -10%, rgba(255,122,26,.14), transparent 60%),
    var(--bg);
  color:var(--cream);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:96px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}
::selection{background:var(--orange);color:#1a1310;}
h1,h2,h3{font-family:var(--font-display);font-weight:400;letter-spacing:.5px;margin:0;}
p{margin:0;}
button{font-family:var(--font-body);cursor:pointer;color:inherit;background:none;}
img{max-width:100%;display:block;}
.hidden{display:none !important;}
.container{max-width:640px;margin:0 auto;padding:0 16px;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(12,10,9,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;max-width:640px;margin:0 auto;
}
.logo-badge{
  width:44px;height:44px;border-radius:50%;overflow:hidden;flex:0 0 auto;
  box-shadow:0 0 0 2px var(--orange), 0 4px 14px rgba(255,90,31,.35);
}
.logo-badge img{width:100%;height:100%;object-fit:cover;}
.brand-text{line-height:1.05;}
.brand-text .name{font-family:var(--font-display);font-size:20px;letter-spacing:.5px;
  background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand-text .tag{font-size:10.5px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}

/* ---------- Flame stepper (signature element) ---------- */
.stepper-wrap{padding:12px 16px 4px;max-width:640px;margin:0 auto;}
.stepper{display:flex;gap:6px;align-items:center;}
.step-seg{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden;position:relative;}
.step-seg .fill{position:absolute;inset:0;width:0%;background:var(--flame);transition:width .5s ease;}
.step-seg.done .fill{width:100%;}
.step-seg.active .fill{width:55%;}
.stepper-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.6px;}
.stepper-labels span{flex:1;text-align:center;}
.stepper-labels span.on{color:var(--orange);font-weight:600;}
@keyframes flicker{
  0%,100%{transform:scale(1) rotate(0deg);opacity:1;}
  30%{transform:scale(1.08) rotate(-3deg);opacity:.92;}
  60%{transform:scale(.96) rotate(2deg);opacity:1;}
}
.flame-icon{display:inline-block;animation:flicker 1.6s ease-in-out infinite;}

/* ---------- Section shell ---------- */
.screen{padding:18px 16px 8px;max-width:640px;margin:0 auto;animation:rise .35s ease;}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.screen h2.title{font-size:26px;margin-bottom:4px;}
.screen .subtitle{color:var(--muted);font-size:13.5px;margin-bottom:18px;line-height:1.5;}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--orange);font-weight:600;margin-bottom:6px;}

/* ---------- Product grid ---------- */
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:380px){.product-grid{grid-template-columns:1fr;}}
.product-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;
  text-align:center;position:relative;overflow:hidden;transition:transform .18s ease, border-color .18s ease;
  color:var(--cream);
}
.product-card:active{transform:scale(.97);}
.product-card:hover{border-color:var(--orange);}
.product-emoji{
  width:104px;height:104px;border-radius:26px;display:flex;align-items:center;justify-content:center;
  font-size:60px;line-height:1;background:var(--flame-soft);border:2px solid rgba(255,122,26,.4);
  box-shadow:inset 0 -6px 14px rgba(0,0,0,.18), 0 6px 16px rgba(255,90,31,.12);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.product-card:hover .product-emoji{transform:scale(1.08) rotate(-3deg);}
.product-card:active .product-emoji{transform:scale(.92);}
.product-emoji{animation:floaty 3.2s ease-in-out infinite;}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
.product-name{font-family:var(--font-display);font-size:18px;line-height:1.12;letter-spacing:.3px;color:var(--cream);}
.product-price{font-size:19px;font-weight:700;color:var(--yellow);}
.product-price small{font-size:11px;color:var(--muted);font-weight:500;}
.product-cta{
  margin-top:2px;width:100%;padding:9px 0;border-radius:999px;border:none;
  background:var(--flame);color:#1a1310;font-weight:700;font-size:12.5px;letter-spacing:.4px;
}

/* ---------- Cart bubble ---------- */
.cart-fab{
  position:fixed;right:16px;bottom:16px;z-index:50;
  background:var(--flame);color:#1a1310;border:none;border-radius:999px;
  padding:14px 18px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);
  font-weight:700;font-size:14px;
}
.cart-fab .count{
  background:#1a1310;color:var(--yellow);border-radius:50%;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;font-size:12px;
}

/* ---------- Sticky bottom bar ---------- */
.bottombar{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:rgba(18,14,12,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
}
.bottombar-inner{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center;}
.bottombar .total-block{flex:1;line-height:1.1;}
.bottombar .total-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.bottombar .total-amount{font-family:var(--font-display);font-size:22px;color:var(--yellow);}
.btn{
  border:none;border-radius:999px;padding:14px 22px;font-weight:700;font-size:14.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s ease, filter .15s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--flame);color:#1a1310;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-primary[disabled]{opacity:.4;pointer-events:none;}
.btn-ghost{background:transparent;color:var(--cream);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--orange);}
.btn-danger{background:rgba(211,34,15,.14);color:#ff8b74;border:1px solid rgba(211,34,15,.4);}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px;font-size:12.5px;border-radius:999px;}

/* ---------- Customize screen ---------- */
.customize-head{
  display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px;margin-bottom:18px;
}
.customize-head .product-emoji{width:72px;height:72px;font-size:42px;border-radius:18px;flex:0 0 auto;animation:none;}
.customize-head .info h3{font-size:18px;}
.customize-head .info .price{color:var(--yellow);font-weight:700;font-size:15px;}
.qty-control{display:flex;align-items:center;gap:10px;margin-left:auto;}
.qty-control button{
  width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card-2);
  color:var(--cream);font-size:16px;line-height:1;
}
.qty-control .qty-val{min-width:18px;text-align:center;font-weight:700;}

.cat-block{margin-bottom:24px;}
.cat-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.cat-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
.cat-title{font-size:13.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--cream);font-weight:700;}
.chip-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(92px, 1fr));gap:10px;}
.chip{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  padding:14px 8px 11px;border-radius:16px;text-align:center;
  background:var(--card);border:2px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), border-color .18s ease, background .18s ease;
  position:relative;min-height:96px;
}
.chip:active{transform:scale(.94);}
.chip .ico{
  width:52px;height:52px;border-radius:14px;background:var(--card-2);
  display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1;
  transition:transform .2s ease;
}
.chip:hover .ico{transform:scale(1.1) rotate(-4deg);}
.chip.on{background:var(--flame-soft);border-color:var(--orange);color:var(--cream);}
.chip.on .ico{background:var(--flame);box-shadow:0 4px 12px rgba(255,90,31,.3);}
.chip.on::after{
  content:"✓";position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;
  background:var(--flame);color:#1a1310;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3);
  animation:pop .25s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{from{transform:scale(0);}to{transform:scale(1);}}
.chip .price-tag{font-size:11px;color:var(--yellow);font-weight:700;}
.chip-label{line-height:1.15;font-size:12px;}
.chip.on .price-tag{color:var(--yellow);}
.chip.extra{border-style:dashed;cursor:pointer;}
.chip{cursor:pointer;}
.chip-remove{
  position:absolute;top:6px;left:8px;
  width:20px;height:20px;border-radius:50%;background:rgba(211,34,15,.9);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;z-index:2;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}

.note-box{
  background:rgba(255,199,44,.07);border:1px solid rgba(255,199,44,.25);border-radius:var(--radius-sm);
  padding:11px 13px;font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:18px;
}

/* ---------- Cart list ---------- */
.cart-item{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;
}
.cart-item-top{display:flex;gap:12px;align-items:flex-start;}
.cart-item .product-emoji{width:56px;height:56px;font-size:32px;border-radius:14px;flex:0 0 auto;animation:none;}
.cart-item-name{font-family:var(--font-display);font-size:15px;}
.cart-item-qty{color:var(--muted);font-size:12px;}
.cart-item-price{margin-left:auto;font-weight:700;color:var(--yellow);white-space:nowrap;}
.cart-item-detail{font-size:11.5px;color:var(--muted-2);margin-top:8px;line-height:1.6;}
.cart-item-actions{display:flex;gap:8px;margin-top:10px;}

.empty-state{
  text-align:center;padding:50px 20px;color:var(--muted);
}
.empty-state .emo{font-size:44px;margin-bottom:10px;}

/* ---------- Summary rows ---------- */
.summary-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
.summary-row{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;color:var(--muted);}
.summary-row.total{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;font-size:17px;color:var(--cream);font-weight:700;}
.summary-row.total .val{color:var(--yellow);font-family:var(--font-display);font-size:20px;}

/* ---------- Payment ---------- */
.yape-card{
  background:linear-gradient(135deg,#3a0f6b,#7b1fa2 60%,#4a0f7d);
  border-radius:var(--radius);padding:18px;margin-bottom:18px;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
}
.yape-card::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;
  background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%);}
.yape-card .lbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#e7d3ff;margin-bottom:6px;}
.yape-card .num{font-family:var(--font-display);font-size:28px;letter-spacing:1px;color:#fff;-webkit-user-select:all;user-select:all;}
.yape-card .hint{font-size:12px;color:#e7d3ff;margin-top:8px;line-height:1.5;}
.copy-btn{margin-top:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;
  padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;}

.upload-box{
  border:2px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;
  background:var(--card);cursor:pointer;transition:border-color .2s ease;
}
.upload-box.has-file{border-style:solid;border-color:var(--green);}
.upload-box .emo{font-size:30px;margin-bottom:8px;}
.upload-box .txt{font-size:13px;color:var(--muted);}
.upload-box .txt b{color:var(--cream);}
#voucherInput{display:none;}
.voucher-preview{margin-top:14px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line);max-height:220px;}
.voucher-preview img{width:100%;object-fit:cover;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:500;}
.field input[type=number], .field input[type=text], .field input[type=tel]{
  width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius-sm);
  padding:13px 14px;color:var(--cream);font-size:16px;font-family:var(--font-body);
}
.field input:focus{outline:none;border-color:var(--orange);}
.field input[readonly]{background:rgba(103,183,106,.08);border-color:var(--green);color:var(--cream);}
.field .helper{font-size:11px;color:var(--muted-2);margin-top:6px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:380px){.two-col{grid-template-columns:1fr;}}

.alert{border-radius:var(--radius-sm);padding:13px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start;margin-top:14px;line-height:1.5;}
.alert .ic{font-size:18px;}
.alert-ok{background:rgba(103,183,106,.12);border:1px solid rgba(103,183,106,.4);color:#a4e0a6;}
.alert-warn{background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.4);color:#ffcf7d;}
.alert-info{background:rgba(255,122,26,.1);border:1px solid rgba(255,122,26,.35);color:#ffcba1;}

/* ---------- Location ---------- */
.map-placeholder{
  height:150px;border-radius:var(--radius);background:
   linear-gradient(rgba(12,10,9,.55),rgba(12,10,9,.75)),
   repeating-linear-gradient(45deg, #241d19 0 12px, #1c1714 12px 24px);
  display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:14px;border:1px solid var(--line);
}
.coord-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;font-size:13px;color:var(--muted);margin-bottom:14px;}
.coord-box b{color:var(--cream);}

/* ---------- Confirm modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(6,5,4,.72);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;z-index:100;
}
.modal-card{
  background:var(--bg-1);border:1px solid var(--line);border-radius:22px 22px 0 0;
  width:100%;max-width:640px;padding:22px 18px calc(22px + env(safe-area-inset-bottom));
  max-height:85vh;overflow-y:auto;animation:slideUp .28s ease;
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-card h3{font-size:20px;margin-bottom:6px;}
.modal-card .sub{color:var(--muted);font-size:13px;margin-bottom:16px;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}

.badge-step{
  display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;
  background:var(--flame-soft);color:var(--orange);padding:4px 10px;border-radius:999px;font-weight:700;margin-bottom:10px;
}

.section-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.back-link{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:5px;background:none;border:none;}
.back-link:hover{color:var(--orange);}

footer.foot{text-align:center;padding:30px 16px 10px;color:var(--muted-2);font-size:11.5px;line-height:1.7;}
footer.foot b{color:var(--muted);}
</style>
</head>

const MONTHS_ES = {ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,set:8,oct:9,nov:10,dic:11};
function money(n){ return "S/. " + (Math.round(n*100)/100).toFixed(2); }
function extractDateStatus(text){
  const lower = (text||"").toLowerCase();
  const today = new Date();
  const todayY = today.getFullYear(), todayM = today.getMonth(), todayD = today.getDate();

  if(/\bhoy\b/.test(lower) || /\btoday\b/.test(lower)){
    return {status:'match', detected:'Hoy'};
  }
  let m = lower.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\b/);
  if(m){
    let d=parseInt(m[1],10), mo=parseInt(m[2],10)-1, y=parseInt(m[3],10);
    if(y<100) y+=2000;
    if(d>=1&&d<=31&&mo>=0&&mo<=11){
      const match = (d===todayD && mo===todayM && y===todayY);
      return {status: match?'match':'mismatch', detected: `${String(d).padStart(2,'0')}/${String(mo+1).padStart(2,'0')}/${y}`};
    }
  }
  m = lower.match(/\b(20\d{2})[\/\-](\d{1,2})[\/\-](\d{1,2})\b/);
  if(m){
    let y=parseInt(m[1],10), mo=parseInt(m[2],10)-1, d=parseInt(m[3],10);
    if(d>=1&&d<=31&&mo>=0&&mo<=11){
      const match = (d===todayD && mo===todayM && y===todayY);
      return {status: match?'match':'mismatch', detected: `${String(d).padStart(2,'0')}/${String(mo+1).padStart(2,'0')}/${y}`};
    }
  }
  m = lower.match(/\b(\d{1,2})\s*(?:de)?\s*(ene|feb|mar|abr|may|jun|jul|ago|sep|set|oct|nov|dic)[a-zé]*\.?\s*(?:de|del)?\s*(\d{2,4})\b/);
  if(m){
    let d=parseInt(m[1],10), mo=MONTHS_ES[m[2]], y=parseInt(m[3],10);
    if(y<100) y+=2000;
    if(mo!=null && d>=1 && d<=31){
      const match = (d===todayD && mo===todayM && y===todayY);
      return {status: match?'match':'mismatch', detected: `${String(d).padStart(2,'0')} ${m[2]} ${y}`};
    }
  }
  return {status:'unknown', detected:null};
}
function findDateIndexInText(text){
  const lower = (text||"").toLowerCase();
  const patterns = [
    /\bhoy\b/i,
    /\btoday\b/i,
    /\b\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}\b/,
    /\b20\d{2}[\/\-]\d{1,2}[\/\-]\d{1,2}\b/,
    /\b\d{1,2}\s*(?:de)?\s*(?:ene|feb|mar|abr|may|jun|jul|ago|sep|set|oct|nov|dic)[a-zé]*\.?\s*(?:de|del)?\s*\d{2,4}\b/
  ];
  for(const p of patterns){
    const m = lower.match(p);
    if(m) return { index: m.index, length: m[0].length };
  }
  return null;
}
function extractVoucherDetails(text){
  const raw = text || "";
  let name = null, time = null, operationNumber = null, dateTimeTogether = null;

  // La fecha y la hora del voucher SIEMPRE van juntas (ej: "02 jul. 2026 - 07:33 p.m.").
  // Ubicamos la fecha y tomamos la hora que esté pegada a ella, ignorando el reloj del celular.
  const dateIdx = findDateIndexInText(raw);
  if(dateIdx){
    const windowStart = Math.max(0, dateIdx.index - 20);
    const windowEnd = Math.min(raw.length, dateIdx.index + dateIdx.length + 45);
    const windowText = raw.slice(windowStart, windowEnd);
    const timeMatch = windowText.match(/\b([01]?\d:[0-5]\d(?:\s*(?:a\.?\s?m\.?|p\.?\s?m\.?))?)\b/i);
    if(timeMatch){
      time = timeMatch[1].replace(/\s+/g,' ').trim();
      // Guardamos el bloque fecha+hora tal como aparece
      const dateStr = raw.slice(dateIdx.index, dateIdx.index+dateIdx.length).trim();
      dateTimeTogether = (dateStr + " - " + time).replace(/\s+/g,' ').trim();
    }
  }

  const opMatch = raw.match(/(?:n[°ro.]{0,4}\s*(?:de\s*)?operaci[oó]n|c[oó]digo\s*(?:de\s*)?operaci[oó]n|nro\.?\s*operaci[oó]n)\D{0,15}(\d{6,15})/i);
  if(opMatch) operationNumber = opMatch[1];

  const nameParts = "([A-ZÁÉÍÓÚÑ][A-Za-zÁÉÍÓÚÑáéíóúñ]+(?:[ \\t]+[A-ZÁÉÍÓÚÑ][A-Za-zÁÉÍÓÚÑáéíóúñ]+){0,3})";
  let nameMatch = raw.match(new RegExp("(?:le\\s+enviaste\\s+a|enviaste\\s+a|pagaste\\s+a|recibiste\\s+de|recibido\\s+de|de[ \\t]*:|para[ \\t]*:)[ \\t]+"+nameParts, 'i'));
  if(!nameMatch){
    nameMatch = raw.match(new RegExp("\\n[ \\t]*a[ \\t]+"+nameParts, 'i'));
  }
  if(nameMatch) name = nameMatch[1].replace(/\s+/g,' ').trim();

  return { name, time, operationNumber, dateTimeTogether };
}

function isRestrictedBrowserContext(){

  return { restricted: inAppUA || oddProtocol || insecure, inAppUA, oddProtocol, insecure };
}

  if(hasManual) lines.push(`Dirección: ${loc.manualAddress.trim()}`);
  if(hasGps){
    lines.push(`Ubicación GPS (Google Maps): https://www.google.com/maps?q=${loc.lat},${loc.lng}`);
    lines.push(`Coordenadas: ${loc.lat.toFixed(6)}, ${loc.lng.toFixed(6)}`);
  }
  if(hasPhone1) lines.push(`Contacto: ${loc.phone1.trim()}${hasPhone2? ` / ${loc.phone2.trim()}`:''}`);
  return lines.length? lines.join("\n") : "No se registró ubicación";
}

/* ============================================================
   CARRITO — cálculos
   ============================================================ */
function itemTotal(item){
  const extrasTotal = Object.entries(item.extras).reduce((s,[name,qty])=>{
    const ex = EXTRAS.find(e=>e.name===name);
    return s + (ex ? ex.price*qty : 0);
  },0);
  return (item.product.price + extrasTotal) * item.qty;
}
function cartTotal(){ return state.cart.reduce((s,it)=>s+itemTotal(it),0); }
function cartCount(){ return state.cart.reduce((s,it)=>s+it.qty,0); }

const app = document.getElementById('app');

const bottomTotal = document.getElementById('bottomTotal');

function renderStepper(activeKey){
  const bar = document.getElementById('stepperBar');
  const labels = document.getElementById('stepperLabels');
  const visible = ["menu","customize","payment","location","confirm"];
  const idx = visible.indexOf(activeKey==='cart' ? 'customize' : activeKey);
  bar.innerHTML = visible.map((k,i)=>{
    const cls = i<idx ? "done" : (i===idx ? "active":"");
    return `<div class="step-seg ${cls}"><div class="fill"></div></div>`;
  }).join("");
  labels.innerHTML = visible.map((k,i)=>{
    const on = i===idx ? "on":"";
    const label = k==='menu'?'Menú':k==='customize'?'Elegir':k==='payment'?'Pago':k==='location'?'Ubicación':'Listo';
    return `<span class="${on}">${i===idx?'<span class="flame-icon">🔥</span> ':''}${label}</span>`;
  }).join("");
}

}

function updateBottombar(){

function groupBy(list, keyFn){
  const map = {};
  list.forEach(x=>{
    const k = keyFn(x);
    (map[k] = map[k]||[]).push(x);
  });
  return map;
}

function cap(s){ return s.charAt(0)+s.slice(1).toLowerCase(); }
function includedSummary(it){
  const total = it.product.base.length;

  if(chosen.length===0) return "Sin ingredientes base seleccionados";
  if(chosen.length===total) return "Todos los ingredientes";
  return chosen.map(cap).join(", ");
}
function draftItemTotal(){
  const d = state.draft;

    return s + (ex? ex.price*qty:0);
  },0);
  return (d.product.price + extrasTotal) * d.qty;
}

function screenPayment(){
  const total = cartTotal();
  const paid = state.payment.amountPaid;

  // --- Validación de MONTO (estricta: debe coincidir exacto, sin margen para continuar) ---
  let amountAlert = "";
  let amountOk = false;
  if(paid!=null && !isNaN(paid)){
    const diff = Math.round((total - paid)*100)/100;
    if(Math.abs(diff) < 0.01){
      amountOk = true;
      amountAlert = `<div class="alert alert-ok"><span class="ic">✅</span><div><b>Monto verificado.</b> Coincide exactamente con el total de tu pedido.</div></div>`;
    } else if(diff > 0){
      amountAlert = `<div class="alert alert-warn"><span class="ic">❌</span><div><b>El monto no coincide.</b> Tu comprobante debe ser exactamente <b>${money(total)}</b>. Según lo ingresado, faltan ${money(diff)}. Corrige el monto o adjunta el comprobante correcto para poder continuar.</div></div>`;
    } else {
      amountAlert = `<div class="alert alert-warn"><span class="ic">❌</span><div><b>El monto no coincide.</b> Tu comprobante debe ser exactamente <b>${money(total)}</b>. Según lo ingresado, hay ${money(Math.abs(diff))} de más. Corrige el monto o adjunta el comprobante correcto para poder continuar.</div></div>`;
    }
  }

  // --- Validación de FECHA (bloquea si detecta una fecha distinta a hoy; pide confirmación si no se pudo leer) ---
  let dateAlert = "";
  const ds = state.payment.ocrDateStatus;
  if(state.payment.dataUrl){
    if(ds==='match'){
      dateAlert = `<div class="alert alert-ok"><span class="ic">✅</span><div><b>Fecha verificada.</b> El comprobante corresponde al pago de hoy.</div></div>`;
    } else if(ds==='mismatch'){
      dateAlert = `<div class="alert alert-warn"><span class="ic">❌</span><div><b>Fecha del comprobante inválida.</b> Detectamos la fecha <b>${state.payment.ocrDateDetected}</b>, pero hoy es <b>${todayFormatted()}</b>. Por seguridad no aceptamos comprobantes de otras fechas. Adjunta el voucher del pago realizado <b>hoy</b>.</div></div>`;
    } else if(state.payment.ocrTried){
      dateAlert = `
      <div class="alert alert-info"><span class="ic">🔎</span><div>
        No pudimos leer automáticamente la fecha de tu comprobante.<br>
        <label style="display:flex;gap:8px;align-items:flex-start;margin-top:10px;cursor:pointer;font-size:12.5px;color:var(--cream);">
          <input type="checkbox" id="dateConfirmCheckbox" style="margin-top:2px;" ${state.payment.dateConfirmChecked?'checked':''}>
          <span>Confirmo que este comprobante corresponde al pago realizado <b>hoy, ${todayFormatted()}</b>.</span>
        </label>
      </div></div>`;
    } else {
      dateAlert = `<div class="alert alert-info"><span class="ic">🔎</span><div>Analizando la fecha de tu comprobante…</div></div>`;
    }
  }

  // --- Banner mientras se analiza la imagen ---
  let analyzingBanner = "";
  if(state.payment.dataUrl && state.payment.ocrRunning){
    analyzingBanner = `<div class="alert alert-info"><span class="ic">🤖</span><div><b>Analizando tu comprobante…</b><br><span id="ocrProgressText">${(state.payment.ocrStage||'Preparando lector…')} ${state.payment.ocrProgress>0?state.payment.ocrProgress+'%':''}</span><br><span style="font-size:11px;color:var(--muted);">La primera vez puede tardar un poco (descarga el lector). No cierres esta pantalla.</span></div></div>`;
  }

  // --- Detalles adicionales del comprobante (informativo, no bloquea) ---
  let detailsHtml = "";
  if(state.payment.ocrTried && (state.payment.ocrName || state.payment.ocrDateTime || state.payment.ocrTime || state.payment.ocrOperationNumber)){
    let rows = [];
    if(state.payment.ocrName) rows.push(`<b>Nombre:</b> ${escapeHtml(state.payment.ocrName)}`);
    if(state.payment.ocrDateTime) rows.push(`<b>Fecha y hora:</b> ${escapeHtml(state.payment.ocrDateTime)}`);
    else if(state.payment.ocrTime) rows.push(`<b>Hora:</b> ${escapeHtml(state.payment.ocrTime)}`);

    detailsHtml = `<div class="alert alert-info"><span class="ic">🧾</span><div>Datos detectados en tu comprobante:<br>${rows.join('<br>')}</div></div>`;
  }

  const canContinue = paymentIsValid();

  <div class="screen">
    <div class="section-nav">
      <button class="back-link" data-action="back-to-cart">← Volver al pedido</button>
    </div>
    <div class="eyebrow">Paso 3</div>

      <div class="hint">Monto exacto a pagar: <b>${money(total)}</b></div>
      <button class="copy-btn" data-action="copy-yape">📋 Copiar número</button>

    </div>
    <input type="file" id="voucherInput" accept="image/*">
    ${state.payment.dataUrl? `<div class="voucher-preview"><img src="${state.payment.dataUrl}"></div>`:''}
    ${analyzingBanner}
    ${state.payment.ocrTried && state.payment.ocrGuess==null && state.payment.ocrUnavailable ? `<div class="alert alert-warn"><span class="ic">📶</span><div><b>No pudimos activar el lector automático.</b> Puede ser por tu conexión a internet.<br><br><button class="btn btn-ghost btn-sm" data-action="retry-ocr" style="margin-top:4px;">🔄 Reintentar</button><br><br>Puedes continuar ingresando el monto manualmente abajo; el negocio revisará tu comprobante a mano antes de confirmar.</div></div>` : ''}
    ${state.payment.ocrTried && state.payment.ocrGuess==null && !state.payment.ocrUnavailable ? `<div class="alert alert-warn"><span class="ic">🔎</span><div><b>No pudimos leer el monto en la imagen.</b> Esto pasa si la foto está borrosa, recortada o muy oscura.<br><br>Consejos: sube una <b>captura de pantalla completa</b> del comprobante (no una foto de otra pantalla), bien enfocada y sin recortar el monto.<br><br><button class="btn btn-ghost btn-sm" data-action="retry-ocr" style="margin-top:4px;">🔄 Volver a analizar</button> o <button class="btn btn-ghost btn-sm" data-action="pick-file" style="margin-top:4px;">📎 Cambiar imagen</button><br><br>También puedes ingresar el monto manualmente abajo, pero <b>quedará marcado como no verificado</b> y el negocio revisará tu comprobante a mano.</div></div>` : ''}
    ${state.payment.ocrGuess!=null ? `<div class="alert alert-ok"><span class="ic">🔎</span><div>Detectamos <b>${money(state.payment.ocrGuess)}</b> junto al símbolo "S/" en tu comprobante.</div></div>` : ''}

    <div class="field" style="margin-top:16px;">
      <label>Monto pagado según tu voucher (S/.)</label>
      <input type="number" inputmode="decimal" step="0.01" min="0" id="amountPaidInput" placeholder="Ej: ${total.toFixed(2)}" value="${paid!=null?paid:''}" ${state.payment.amountLocked?'readonly':''}>

      ` : `<div class="helper">Debe coincidir exactamente con el total del pedido para poder continuar.</div>`}
      ${state.payment.amountManuallyEdited? `<div class="helper" style="color:#ffcf7d;">⚠️ Monto corregido manualmente — no verificado por el sistema.</div>` : ''}
    </div>
    ${amountAlert}
    ${dateAlert}
    ${detailsHtml}

    <button class="btn btn-primary btn-block" style="margin-top:18px;" id="paymentContinueBtn" data-action="go-location" ${!canContinue?'disabled':''}>
      ${canContinue? 'Continuar a ubicación →' : '🔒 Corrige el pago para continuar'}
    </button>
  </div>`;
}
function formatPhone(n){
  const s = String(n).replace(/\D/g,'');
  const local = s.length>9? s.slice(-9): s;
  return local.replace(/(\d{3})(\d{3})(\d{3})/,'$1 $2 $3');
}
function legacyCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function copyToClipboard(text, btnEl){
  const original = "📋 Copiar número";
  function success(){
    btnEl.textContent = "✅ Copiado";
    setTimeout(()=>{ btnEl.textContent = original; },1500);
  }
  function fail(){
    btnEl.textContent = "👆 Mantén presionado el número para copiarlo";
    setTimeout(()=>{ btnEl.textContent = original; },3000);
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(success).catch(()=>{
      legacyCopy(text) ? success() : fail();
    });
  } else {
    legacyCopy(text) ? success() : fail();
  }
}

function render(){
  renderStepper(state.screen);
  let html = "";
  switch(state.screen){
    case "menu": html = screenMenu(); break;
    case "customize": html = screenCustomize(); break;
    case "cart": html = screenCart(); break;
    case "payment": html = screenPayment(); break;
    case "location": html = screenLocation(); break;
    case "confirm": html = screenConfirm(); break;
  }
  app.innerHTML = html;
  updateBottombar();
}

document.addEventListener('keydown', (e)=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const t = e.target.closest('[data-action][role="button"]');
  if(!t) return;
  e.preventDefault();
  t.click();
});

document.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  if(action==='open'){ openCustomize(t.dataset.id, null); }
  else if(action==='back-to-menu'){ state.editingIndex=null; state.draft=null; setScreen('menu'); }
  else if(action==='back-to-cart'){ setScreen('cart'); }
  else if(action==='back-to-payment'){ setScreen('payment'); }
  else if(action==='back-to-location'){ setScreen('location'); }
  else if(action==='qty-plus'){ state.draft.qty++; render(); }
  else if(action==='qty-minus'){ if(state.draft.qty>1){state.draft.qty--; render();} }
  else if(action==='select-all-ings'){
    state.draft.included = new Set(state.draft.product.base);
    render();
  }
  else if(action==='clear-all-ings'){
    state.draft.included = new Set();
    render();
  }
  else if(action==='toggle-ing'){
    const ing = t.dataset.ing;
    if(state.draft.included.has(ing)) state.draft.included.delete(ing);
    else state.draft.included.add(ing);
    render();
  }
  else if(action==='remove-extra'){
    e.stopPropagation();
    const ing = t.dataset.ing;
    delete state.draft.extras[ing];
    render();
  }
  else if(action==='toggle-extra'){
    const ing = t.dataset.ing;
    const cur = state.draft.extras[ing]||0;
    state.draft.extras[ing] = cur>=5 ? 1 : cur+1;
    render();
  }
  else if(action==='add-to-cart'){
    const item = {
      product: state.draft.product,
      qty: state.draft.qty,
      included: new Set(state.draft.included),
      extras: Object.assign({}, state.draft.extras)
    };
    if(state.editingIndex!=null){ state.cart[state.editingIndex] = item; }
    else { state.cart.push(item); }
    state.draft = null; state.editingIndex = null;
    setScreen('cart');
  }
  else if(action==='edit-item'){ const idx=+t.dataset.idx; openCustomize(state.cart[idx].product.id, idx); }
  else if(action==='remove-item'){ const idx=+t.dataset.idx; state.cart.splice(idx,1); render(); }
  else if(action==='go-payment'){ setScreen('payment'); }
  else if(action==='pick-file'){ document.getElementById('voucherInput').click(); }
  else if(action==='retry-ocr'){
    if(state.payment.dataUrl){
      state.payment.ocrTried = false;
      state.payment.ocrGuess = null;
      state.payment.amountLocked = false;
      state.payment.ocrUnavailable = false;
      state.payment.ocrError = false;
      state.payment.ocrRunning = true;
      state.payment.ocrProgress = 0;
      state.payment.ocrStage = 'Preparando lector…';
      render();
      tryOCR(state.payment.dataUrl);
    }
  }
  else if(action==='copy-yape'){ copyToClipboard(YAPE_NUMBER, t); }
  else if(action==='unlock-amount'){
    state.payment.amountLocked = false;
    state.payment.amountManuallyEdited = true;
    render();
    const input = document.getElementById('amountPaidInput');
    if(input) input.focus();
  }
  else if(action==='go-location'){ setScreen('location'); }
  else if(action==='get-location'){ requestLocation(); }
  else if(action==='go-confirm'){ setScreen('confirm'); }
  else if(action==='open-confirm-modal'){
    if(!paymentIsValid()){ setScreen('confirm'); return; }
    document.body.insertAdjacentHTML('beforeend', renderConfirmModal());
  }
  else if(action==='modify-order'){
    document.getElementById('confirmModal')?.remove();
    setScreen('cart');
  }
  else if(action==='confirm-ok'){
    document.getElementById('confirmModal')?.remove();
    if(!paymentIsValid()){ setScreen('confirm'); return; }
    sendOrderToWhatsApp();
  }
});

/* ============================================================
   OCR opcional del comprobante (mejora progresiva)
   ============================================================ */
function preprocessImageForOCR(dataUrl){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      try{
        // Escalar para que el lado menor tenga al menos ~1400px (mejora mucho el OCR en fotos pequeñas)
        const minTarget = 1400;
        let scale = 1;
        const minSide = Math.min(img.width, img.height);
        if(minSide < minTarget) scale = minTarget / minSide;
        scale = Math.min(scale, 3); // no exagerar
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        // Escala de grises + aumento de contraste suave
        for(let i=0;i<d.length;i+=4){
          let gray = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
          // contraste (empuja claros a más claro y oscuros a más oscuro)
          gray = (gray - 128) * 1.35 + 128;
          gray = Math.max(0, Math.min(255, gray));
          d[i] = d[i+1] = d[i+2] = gray;
        }
        ctx.putImageData(imgData, 0, 0);
        resolve(canvas.toDataURL('image/png'));
      }catch(e){
        resolve(dataUrl); // si algo falla, usamos la imagen original
      }
    };
    img.onerror = ()=> resolve(dataUrl);
    img.src = dataUrl;
  });
}

function extractAmountFromText(text){
  const raw = text || "";
  const found = [];

  // Prioridad 1: número justo después del símbolo de soles, tolerando errores comunes de OCR:
  // "S/", "S /", "S/.", "SI", "S1", "5/", "$/", "$", "SI." etc. Permite espacios/saltos entremedio.
  const currencyRegex = /(?:s\s*[\/1i|]\.?|s\s*\/|\$\s*\/?|soles?)\s*[:\-]?\s*(\d{1,4}(?:[.,]\d{1,2})?)/gi;
  let m;
  while((m = currencyRegex.exec(raw)) !== null){
    const num = parseFloat(m[1].replace(',','.'));
    if(!isNaN(num) && num>0 && num<5000){ found.push(num); }
  }
  if(found.length){
    return { amount: Math.max(...found), anchoredToCurrency: true };
  }

  // Prioridad 2: número con decimales cerca de palabras clave de monto
  const kwRegex = /(?:monto|total|enviaste|pagaste|pago(?:\s+de)?|recibiste|import[eo])\D{0,20}(\d{1,4}[.,]\d{2})/gi;
  const kwFound = [];
  while((m = kwRegex.exec(raw)) !== null){
    const num = parseFloat(m[1].replace(',','.'));
    if(!isNaN(num) && num>0 && num<5000){ kwFound.push(num); }
  }
  if(kwFound.length){
    return { amount: Math.max(...kwFound), anchoredToCurrency: true };
  }

  // Respaldo: cualquier número con dos decimales en el texto (no verificado con certeza)
  const matches = raw.match(/\d{1,4}[.,]\d{2}/g) || [];
  let best = null;
  matches.forEach(mm=>{
    const num = parseFloat(mm.replace(',','.'));
    if(!isNaN(num) && num>0 && num<5000) best = num;
  });
  return { amount: best, anchoredToCurrency: false };
}

// --- Worker persistente de Tesseract (se crea una sola vez y se reutiliza) ---
let __ocrWorker = null;
let __ocrWorkerPromise = null;
async function getOcrWorker(){
  if(__ocrWorker) return __ocrWorker;
  if(__ocrWorkerPromise) return __ocrWorkerPromise;
  __ocrWorkerPromise = (async ()=>{
    const worker = await Tesseract.createWorker('eng', 1, {
      logger: (mm)=>{
        if(mm && typeof mm.progress === 'number'){
          state.payment.ocrProgress = Math.round(mm.progress*100);
          if(mm.status){
            if(/load|initializ|download|worker/i.test(mm.status)) state.payment.ocrStage = 'Cargando lector…';
            else if(/recogniz/i.test(mm.status)) state.payment.ocrStage = 'Leyendo tu comprobante…';
          }
          if(state.screen==='payment') updateOcrProgressUI();
        }
      }
    });
    __ocrWorker = worker;
    return worker;
  })();
  return __ocrWorkerPromise;
}

// Precarga el lector apenas se entra a la pantalla de pago, para que ya esté listo al subir la foto
async function preloadOcr(){
  if(typeof Tesseract === 'undefined') return;
  try{ await getOcrWorker(); }catch(e){ /* silencioso */ }
}

// Recorta una porción vertical de la imagen (0..1) para enfocar el OCR donde suele estar el monto
function cropImage(dataUrl, topFrac, bottomFrac){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      try{
        const y0 = Math.round(img.height*topFrac);
        const y1 = Math.round(img.height*bottomFrac);
        const h = Math.max(1, y1-y0);
        const scale = Math.min(3, Math.max(1, 1200/img.width));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(h*scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, y0, img.width, h, 0, 0, canvas.width, canvas.height);
        // contraste + gris
        const d = ctx.getImageData(0,0,canvas.width,canvas.height);
        const px = d.data;
        for(let i=0;i<px.length;i+=4){
          let g = 0.299*px[i]+0.587*px[i+1]+0.114*px[i+2];
          g = (g-128)*1.4+128; g=Math.max(0,Math.min(255,g));
          px[i]=px[i+1]=px[i+2]=g;
        }
        ctx.putImageData(d,0,0);
        resolve(canvas.toDataURL('image/png'));
      }catch(e){ resolve(dataUrl); }
    };
    img.onerror = ()=> resolve(dataUrl);
    img.src = dataUrl;
  });
}

async function tryOCR(dataUrl){
  state.payment.ocrTried = false;
  state.payment.ocrRunning = true;
  state.payment.ocrProgress = 0;
  state.payment.ocrStage = 'Preparando lector…';
  if(state.screen==='payment') render();

  // Espera a que la librería termine de cargar desde el CDN (hasta ~12s) antes de rendirse
  if(typeof Tesseract === 'undefined'){
    state.payment.ocrStage = 'Cargando lector…';
    if(state.screen==='payment') updateOcrProgressUI();
    let waited = 0;
    while(typeof Tesseract === 'undefined' && !window.__tesseractFailed && waited < 12000){
      await new Promise(r=>setTimeout(r, 300));
      waited += 300;
    }
  }

  if(typeof Tesseract === 'undefined'){
    state.payment.ocrTried = true;
    state.payment.ocrRunning = false;
    state.payment.ocrUnavailable = true;
    state.payment.ocrDateStatus = 'unknown';
    state.payment.amountLocked = false;
    if(state.screen==='payment') render();
    return;
  }

  try{
    const worker = await getOcrWorker();

    async function readText(imgSrc){
      const { data } = await worker.recognize(imgSrc);
      return (data && data.text) ? data.text : "";
    }

    // Pasada 1: imagen completa con contraste/escala
    state.payment.ocrStage = 'Leyendo tu comprobante…';
    if(state.screen==='payment') updateOcrProgressUI();
    const processed = await preprocessImageForOCR(dataUrl);
    let fullText = await readText(processed);
    let amountInfo = extractAmountFromText(fullText);

    // Pasada 2: si no hay monto, enfoca la mitad superior (donde Yape/Plin muestran el importe grande)
    if(amountInfo.amount==null){
      state.payment.ocrStage = 'Analizando el monto…';
      if(state.screen==='payment') updateOcrProgressUI();
      const topCrop = await cropImage(dataUrl, 0.10, 0.60);
      const topText = await readText(topCrop);
      const amtTop = extractAmountFromText(topText);
      fullText += "\n" + topText;
      if(amtTop.amount!=null) amountInfo = amtTop;
    }

    // Pasada 3: si aún nada, prueba la imagen original sin procesar
    if(amountInfo.amount==null){
      const rawText = await readText(dataUrl);
      const amtRaw = extractAmountFromText(rawText);
      fullText += "\n" + rawText;
      if(amtRaw.amount!=null) amountInfo = amtRaw;
    }

    state.payment.ocrTried = true;
    state.payment.ocrRunning = false;
    state.payment.ocrRawText = fullText;

    state.payment.ocrGuess = amountInfo.amount;
    state.payment.ocrAmountAnchored = amountInfo.anchoredToCurrency;
    if(amountInfo.amount!=null){
      state.payment.amountPaid = amountInfo.amount;
      state.payment.amountLocked = true;
      state.payment.amountManuallyEdited = false;
    } else {
      state.payment.amountLocked = false;
    }

    const dateInfo = extractDateStatus(fullText);
    state.payment.ocrDateStatus = dateInfo.status;
    state.payment.ocrDateDetected = dateInfo.detected;

    const details = extractVoucherDetails(fullText);
    state.payment.ocrName = details.name;
    state.payment.ocrTime = details.time;
    state.payment.ocrOperationNumber = details.operationNumber;
    state.payment.ocrDateTime = details.dateTimeTogether;

    if(state.screen==='payment') render();
  }catch(err){
    state.payment.ocrTried = true;
    state.payment.ocrRunning = false;
    state.payment.ocrError = true;
    state.payment.ocrDateStatus = 'unknown';
    state.payment.amountLocked = false;
    if(state.screen==='payment') render();
  }
}

/* ============================================================
   UBICACIÓN
   ============================================================ */
function requestLocation(){
  state.location.error = null;
  if(!navigator.geolocation){
    state.location.error = "Este navegador no permite compartir ubicación por GPS. Escribe tu dirección en el campo de arriba, funciona igual de bien.";
    render();
    return;
  }
  navigator.geolocation.getCurrentPosition(pos=>{
    state.location.lat = pos.coords.latitude;
    state.location.lng = pos.coords.longitude;
    state.location.accuracy = pos.coords.accuracy;
    state.location.error = null;
    render();
  }, err=>{
    let msg = "No pudimos obtener tu ubicación por GPS. Puedes escribir tu dirección arriba y continuar sin problema.";
    if(err.code===1){
      msg = "El permiso de ubicación está bloqueado (o la app donde abriste este enlace no lo permite). Abre este enlace en Chrome o Safari desde el menú ⋮ → \"Abrir en el navegador\", o simplemente escribe tu dirección arriba.";
    } else if(err.code===2){
      msg = "No se pudo determinar tu posición. Verifica que el GPS de tu dispositivo esté activado, o escribe tu dirección arriba.";
    } else if(err.code===3){
      msg = "Se agotó el tiempo esperando tu ubicación. Intenta de nuevo o escribe tu dirección arriba.";
    }
    state.location.error = msg;
    render();
  }, {enableHighAccuracy:true, timeout:12000});
}

   ============================================================ */
function buildOrderText(){
  const total = cartTotal();
  const paid = state.payment.amountPaid || 0;
  const diff = Math.round((total-paid)*100)/100;

  let lines = [];
  lines.push(`🔥 *TRILLY BURGUER - NUEVO PEDIDO* 🔥`);
  lines.push(`Código: *${state.orderCode}*`);
  lines.push("");
  lines.push("*Detalle del pedido:*");
  state.cart.forEach(it=>{
    const extrasList = Object.entries(it.extras).filter(([,q])=>q>0).map(([n,q])=>`+${cap(n)} x${q}`);
    lines.push(`• ${it.qty}x ${it.product.name} — ${money(itemTotal(it))}`);
    lines.push(`   Incluye: ${includedSummary(it)}`);
    if(extrasList.length) lines.push(`   Extras: ${extrasList.join(", ")}`);
  });
  lines.push("");
  lines.push(`*Total del pedido:* ${money(total)}`);
  lines.push(`*Monto pagado (voucher):* ${money(paid)}`);
  if(diff>0.004) lines.push(`⚠️ *Falta pagar:* ${money(diff)}`);
  else if(diff<-0.004) lines.push(`💸 *Devolución pendiente:* ${money(Math.abs(diff))}`);
  else lines.push(`✅ Pago completo y verificado`);

  if(state.payment.amountLocked){
    lines.push(`🔎 Monto verificado automáticamente desde la imagen del comprobante.`);
  } else {
    lines.push(`⚠️ *Monto declarado manualmente por el cliente* — el sistema no pudo leerlo (o fue corregido) en la imagen. Revisar el comprobante adjunto con atención.`);
  }

  if(state.payment.ocrName || state.payment.ocrDateTime || state.payment.ocrTime || state.payment.ocrOperationNumber){
    lines.push("");
    lines.push("*Datos del comprobante:*");
    if(state.payment.ocrName) lines.push(`Nombre: ${state.payment.ocrName}`);
    if(state.payment.ocrDateTime){
      lines.push(`Fecha y hora del pago: ${state.payment.ocrDateTime}`);
    } else {
      lines.push(`Fecha: ${todayFormatted()}`);
      if(state.payment.ocrTime) lines.push(`Hora: ${state.payment.ocrTime}`);
    }
    if(state.payment.ocrOperationNumber) lines.push(`N° de operación: ${state.payment.ocrOperationNumber}`);
  }

  lines.push("");
  lines.push(`📍 *Ubicación de entrega:*`);
  lines.push(locationSummaryText());
  return lines.join("\n");
}

function isMobileOrTablet(){
  const ua = navigator.userAgent || navigator.vendor || window.opera || "";
  const uaMobile = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
  const isIPadOS = /Macintosh/i.test(ua) && navigator.maxTouchPoints > 1; // iPadOS moderno se identifica como "Macintosh"
  const isIPadUA = /iPad/i.test(ua);
  return uaMobile || isIPadOS || isIPadUA;
}

function sendOrderToWhatsApp(){
  const text = buildOrderText();
  const encoded = encodeURIComponent(text);
  const numberDigits = String(WHATSAPP_NUMBER).replace(/\D/g,'');

  // Siempre abrimos la APP de WhatsApp (nunca WhatsApp Web).
  // whatsapp:// abre la app nativa tanto en móvil/tablet como en la app de escritorio.
  const appUrl = `whatsapp://send?phone=${numberDigits}&text=${encoded}`;
  const fallbackUrl = `https://wa.me/${numberDigits}?text=${encoded}`; // solo si no hay app instalada

  let appOpened = false;
  const onHide = ()=>{ appOpened = true; };
  document.addEventListener('visibilitychange', onHide);
  window.addEventListener('blur', onHide);

  // Intento de abrir la app nativa
  window.location.href = appUrl;

  // Respaldo: si tras 1.6s la app no tomó el control (no está instalada), abrimos wa.me
  setTimeout(()=>{
    document.removeEventListener('visibilitychange', onHide);
    window.removeEventListener('blur', onHide);
    if(!appOpened){ window.open(fallbackUrl, '_blank'); }
  }, 1600);

  showSentBanner();
}

function showSentBanner(){
  app.innerHTML = `
  <div class="screen">
    <div class="empty-state">
      <div class="emo">✅</div>
      <h2 class="title" style="margin-bottom:10px;">¡Pedido enviado!</h2>
      <p class="subtitle">Tu pedido <b>${state.orderCode}</b> se está enviando a Trilly Burguer por WhatsApp.</p>
      <div class="alert alert-info" style="text-align:left;margin-top:16px;"><span class="ic">📎</span><div>No olvides <b>adjuntar la foto de tu voucher</b> en la conversación de WhatsApp que se abrió.</div></div>
      <br>
      <button class="btn btn-primary" data-action="restart">Hacer otro pedido</button>
    </div>
  </div>`;
  bottombar.classList.add('hidden');
}

document.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-action="restart"]');
  if(!t) return;
  state.cart = [];
  state.payment = { file:null, dataUrl:null, amountPaid:null, ocrTried:false, ocrGuess:null, ocrAmountAnchored:false, amountLocked:false, amountManuallyEdited:false, ocrDateStatus:'unknown', ocrDateDetected:null, dateConfirmChecked:false, ocrName:null, ocrTime:null, ocrOperationNumber:null, ocrDateTime:null, ocrRunning:false, ocrProgress:0, ocrStage:"", ocrRawText:"", ocrUnavailable:false, ocrError:false };
  state.location = { lat:null, lng:null, accuracy:null, manualAddress:"", phone1:"", phone2:"", error:null };
  state.orderCode = "TB-" + Math.random().toString(36).slice(2,7).toUpperCase();
  setScreen('menu');
});

/* ---------- Inicio ---------- */
render();

})();
